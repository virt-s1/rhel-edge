---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # Delay Dependabot version-update PRs so newly released action versions
    # have time to show regressions before we pick them up. Cooldown never
    # applies to security updates, which still open immediately.
    cooldown:
      default-days: 3
      semver-major-days: 30
    # Dependabot's defaults are dependencies plus the ecosystem label; setting
    # labels replaces them, so all three have to be listed.
    labels:
      - dependencies
      - github_actions
      - auto-merge
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
