---
name: AWS edge ami cleanup job

on:
  workflow_dispatch:
  schedule:
    # Run every four hours
    - cron: '0 */4 * * *'

permissions: {}

jobs:
  cleanup-ami:
    permissions:
      contents: read
      id-token: write
    # Do not run this job on any fork repos
    if: github.repository == 'virt-s1/rhel-edge'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200  # Keep credentials valid until cleanup finishes.
      - name: Cleanup aws resources
        run: ./tools/aws-ami-cleanup.sh
        timeout-minutes: 60
