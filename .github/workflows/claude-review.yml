---
# Automated AI PR review via the Claude Code GitHub Action (Project Judoon,
# THEEDGE-4881). Auth is Google Vertex AI with Workload Identity Federation
# (no direct Anthropic API key, no secrets). See claude-review-setup.md for
# what this workflow needs, and the internal team-operations repo for the
# real values and one-time GCP/IAM setup steps.
name: Claude review

on:
  # pull_request_target, not pull_request: GitHub withholds repo Variables
  # and Secrets from pull_request runs triggered by a fork, so
  # GCP_WORKLOAD_IDENTITY_PROVIDER arrives empty and auth fails outright --
  # which is nearly every real contributor PR here. pull_request_target runs
  # in the base repo's context instead, so secrets/vars are available.
  # claude-code-action v1.0.236 normalizes pull_request_target to
  # pull_request internally, so its own actor write-permission check and
  # base-branch restore of its SENSITIVE_PATHS (.claude, .mcp.json,
  # .claude.json, .gitmodules, .ripgreprc, CLAUDE.md, CLAUDE.local.md,
  # .husky) still apply. The checkout and AGENTS.md-restore steps below add
  # what that restore doesn't cover.
  pull_request_target:
    types:
      - opened
      - synchronize
    # Skip the daily compose-bump PRs: they only touch compose/ tracking
    # files (CI-managed, nothing to review), so reviewing them is wasted
    # cost. paths-ignore skips a PR only when every changed file matches, so
    # a PR touching compose/ plus anything else still gets reviewed.
    paths-ignore:
      - 'compose/**'
  # Manual override for the author_association gate below (e.g. a
  # first-time contributor's otherwise-legitimate PR): a repo
  # collaborator can force a review by commenting "/claude-review" on
  # the PR. issue_comment fires for comments on both issues and PRs and
  # runs with full repo-secret access regardless of who commented --
  # unlike workflow_dispatch, GitHub does not gate who can post a comment --
  # so the authorize job below re-checks that the comment is actually on a
  # PR and that the commenter (not the PR author) is at least a
  # COLLABORATOR before trusting the trigger.
  issue_comment:
    types:
      - created

# Only the review job needs write access; everything else stays read-only.
permissions: {}

# Cancel a superseded review when new commits are pushed to the same PR, so we
# do not pay for reviews of stale diffs. Concurrency grouping/cancellation is
# evaluated when a run is created, before the authorize job's trust check
# even starts -- so cancel-in-progress must not be unconditionally true, or
# *any* comment on a PR (not just a valid /claude-review from a collaborator)
# would join this group and cancel a real review already running, only to
# then resolve to proceed=false and skip. Only a new pull_request_target run
# (a genuinely superseding commit) cancels the in-progress run; an
# issue_comment run -- valid command or not -- just queues behind it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  authorize:
    name: Authorize review trigger
    # Defence-in-depth gate, computed in its own job (no secrets, no
    # elevated permissions) so a malformed/untrusted trigger is a quiet
    # "review job skipped" rather than a failing status check. Both
    # triggers run in the base repo's context with secrets available, so
    # the review job below (and the Vertex WIF auth it does, meaning no
    # credential is ever minted) only runs once this job says so.
    # - pull_request_target: checks the PR author's association.
    # - issue_comment: checks the *commenter's* association instead (the PR
    #   author may be nobody in particular), and additionally requires the
    #   comment to be on a PR (not a plain issue -- issue_comment fires for
    #   both) and to contain the "/claude-review" command at the start of a
    #   line, word-bounded (so "/claude-reviewer, please look" doesn't
    #   count) -- GitHub Actions expressions have no regex/substring
    #   functions to express that, so it's done in bash here instead.
    #
    # Both branches trust GitHub's author_association string rather than
    # querying actual push access (which would need `administration: read`,
    # broader than any other permission this workflow holds anywhere). Fine
    # today: every current collaborator on this repo has write or admin
    # access. If someone is ever added as a read-only collaborator, they'd
    # pass this gate -- claude-code-action's own write-permission check
    # downstream would still reject them, just after the Vertex credential
    # is already minted (and immediately moved out of the checkout, per the
    # step below).
    #
    # The `if:` below is a cheap optimization only, not a security boundary
    # (the bash check above is the real gate either way): it keeps this job
    # from spinning up a runner for every comment on every issue repo-wide.
    # It can't be precise (GitHub Actions expressions can't word-boundary
    # match), so a near-miss like "/claude-reviewer ..." still reaches the
    # runner and is caught there -- that's fine, it's not meant to stop that
    # case, just the bulk of unrelated comments. Uses contains(), not
    # startsWith(): the bash grep above matches "/claude-review" at the
    # start of any line, not just the start of the whole comment, so the
    # pre-filter must allow that too or it'd never let those through.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude-review'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check trust and command
        id: check
        env:
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          proceed=false
          case "$GITHUB_EVENT_NAME" in
            pull_request_target)
              case "$PR_ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) proceed=true ;;
              esac
              ;;
            issue_comment)
              if [ "$IS_PR_COMMENT" = "true" ] && grep -qE '^/claude-review([[:space:]]|$)' <<<"$COMMENT_BODY"; then
                case "$COMMENT_ASSOCIATION" in
                  OWNER|MEMBER|COLLABORATOR) proceed=true ;;
                esac
              fi
              ;;
          esac
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  review:
    name: "🤖 Claude review"
    needs: authorize
    if: needs.authorize.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # required for Vertex AI OIDC / Workload Identity Federation
      actions: read  # lets the agent view CI job logs/results on this PR
    env:
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID }}
      CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION }}
    steps:
      - name: Resolve PR context
        # Normalizes PR number/base branch/checkout ref across both trigger
        # types, since only pull_request_target populates
        # github.event.pull_request. issue_comment only gives us the PR
        # (issue) number, so look the rest up; everything event-supplied is
        # passed through env, never interpolated into the shell, per the
        # same rule the rest of this file follows.
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            number="$ISSUE_NUMBER"
            base_ref=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
            # refs/pull/<n>/head always exists for any PR, same-repo or
            # fork, open or closed -- unlike a bare head SHA, it doesn't
            # depend on actions/checkout's pull_request_target-specific
            # fork-fetch handling, which issue_comment doesn't trigger.
            checkout_ref="refs/pull/$number/head"
          else
            number="$EVENT_PR_NUMBER"
            base_ref="$EVENT_BASE_REF"
            checkout_ref="$EVENT_HEAD_SHA"
          fi
          {
            echo "number=$number"
            echo "base_ref=$base_ref"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target defaults to checking out the base branch, not
          # the PR head -- we still want to review the PR's actual changes.
          ref: ${{ steps.resolve-pr.outputs.checkout_ref }}
          # Required: under pull_request_target, checkout v7 refuses to check
          # out fork PR head code unless this is set, because that code then
          # runs in a context with the base repo's secrets ("pwn request").
          # We opt in deliberately: this workflow reviews the fork's code, it
          # does not build or execute it, and every path the Claude CLI would
          # auto-read or auto-execute (.claude, .mcp.json, hooks, etc., plus
          # AGENTS.md below) is restored from the trusted base before the CLI
          # starts. Only collaborators can trigger the job at all (the if:
          # guard above and the action's own write-permission check); a
          # manual "/claude-review" comment run is gated the same way, just
          # checking the commenter's association instead of the PR author's.
          allow-unsafe-pr-checkout: true
          # This job never needs authenticated git push/pull after checkout.
          # Doesn't fully close the .git/config exposure below on its own --
          # the claude-code-action re-embeds its own token-bearing credential
          # into .git/config regardless, in every mode -- but no reason to
          # also let checkout write one first.
          persist-credentials: false

      - name: Restore AGENTS.md from the base branch
        # The review prompt tells the agent to follow AGENTS.md, but it isn't
        # in claude-code-action's own SENSITIVE_PATHS restore list (.claude,
        # .mcp.json, .claude.json, .gitmodules, .ripgreprc, CLAUDE.md,
        # CLAUDE.local.md, .husky). Under pull_request_target a fork PR can
        # rewrite AGENTS.md to redirect the agent's instructions, so restore it
        # from the trusted base branch before the review runs. Restore from the
        # base branch tip (origin/<base ref>), matching what the action's own
        # restore does, so AGENTS.md comes from the same trusted base commit as
        # the paths above. The base ref is owned by this (trusted) repo, not
        # the fork, and is passed via env rather than inline ${{ }} so it can't
        # inject into the shell. The checkout above is shallow/single-ref, so
        # the base branch isn't local yet -- fetch it first.
        env:
          BASE_REF: ${{ steps.resolve-pr.outputs.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          # Remove the PR's AGENTS.md first -- it may be a symlink (a
          # `> AGENTS.md` redirect would write through the link, leaving the
          # attacker-controlled target) or even a directory (AGENTS.md/x), so
          # rm -rf. Then restore with `git checkout`, which writes a fresh
          # regular file, and unstage so the revert isn't folded into a commit
          # the agent later makes. No `|| true`: AGENTS.md drives the review
          # prompt, so if it can't be restored from base we want to fail loud
          # rather than review with it missing. Mirrors restore-config.ts.
          rm -rf AGENTS.md
          git checkout "origin/${BASE_REF}" -- AGENTS.md
          git reset -q -- AGENTS.md
          # Strip any nested instruction config a fork PR plants in a subdir:
          # Claude Code auto-reads AGENTS.md / CLAUDE.md / CLAUDE.local.md and
          # loads a subdirectory .claude (rules/, skills/) on demand, and
          # neither the restore above nor the action covers nested copies.
          # -prune + `rm -rf` (not -delete) so a dir planted at one of these
          # names (e.g. AGENTS.md/x) is removed too. The action's other
          # SENSITIVE_PATHS (.mcp.json, .claude.json, .ripgreprc, .gitmodules,
          # .husky) are read only from the repo root, which the action
          # restores, so they're not swept here.
          find . -mindepth 2 \( -iname 'AGENTS.md' -o -iname 'CLAUDE.md' -o -iname 'CLAUDE.local.md' -o -iname '.claude' \) -prune -exec rm -rf {} +

      - name: Authenticate to Google Cloud
        id: gcp-auth
        # Direct WIF access: the GitHub repo's principalSet is granted
        # Vertex AI access on the GCP project, so no secret and no service
        # account are needed. For service-account impersonation instead, add
        # a `service_account:` input. See claude-review-setup.md for what
        # these variables are and where the real values live.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID }}

      - name: Move Vertex AI credentials out of the checkout
        # google-github-actions/auth writes the WIF credentials file into
        # $GITHUB_WORKSPACE by design (its own README says so). The review
        # step below grants Read/Grep/Glob over that same checkout tree, so a
        # PR with prompt-injected title/body/diff text could otherwise get
        # the agent to read and leak this live GCP credential in a public
        # comment. Read/Grep/Glob are scoped to ./** (the checkout) in
        # --allowedTools, so moving this file to $RUNNER_TEMP -- outside that
        # scope -- is a real boundary, not just discovery-avoidance. The
        # `settings` deny rule below is a second, independent layer in case
        # that scoping is ever loosened.
        env:
          CREDS_PATH: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: |
          new_path="${RUNNER_TEMP}/$(basename "$CREDS_PATH")"
          mv "$CREDS_PATH" "$new_path"
          {
            echo "GOOGLE_APPLICATION_CREDENTIALS=$new_path"
            echo "GOOGLE_GHA_CREDS_PATH=$new_path"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$new_path"
          } >> "$GITHUB_ENV"

      - name: Record review metadata
        id: review-date
        # short_sha comes from the actual checkout, not event data, so it's
        # correct for both trigger types (issue_comment resolves its
        # checkout ref to refs/pull/<n>/head, not a known SHA, above).
        run: |
          {
            echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          # No Claude GitHub App installed for this pilot; use the workflow's
          # own GITHUB_TOKEN instead (granted pull-requests: write, above).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_vertex: "true"
          # Lets Claude look at this PR's own CI job logs/results (e.g. a
          # failed Testing Farm run) rather than just the diff. Requires the
          # matching actions: read job permission, above.
          additional_permissions: |
            actions: read
          # Two things denied, each under all three tool names (Read/Grep/
          # Glob) rather than just Read: a Read-keyed deny rule isn't
          # reliably enough to also stop Grep/Glob on the same path (the
          # enforcement check is reportedly on the directory a Grep/Glob
          # call is invoked with, not on paths it might incidentally
          # traverse into), so don't assume coverage carries over between
          # tools.
          # - gha-creds-*.json: second, independent layer alongside scoping
          #   Read/Grep/Glob to ./** below -- deny rules outrank allow rules
          #   regardless of specificity, so this still blocks the GCP
          #   credential even if that scoping is ever loosened.
          # - .git/**: the claude-code-action re-embeds the live
          #   GITHUB_TOKEN into .git/config's remote URL after checkout, in
          #   every mode, regardless of persist-credentials above. That file
          #   sits inside ./**, so this is the actual boundary, not a
          #   backup.
          settings: |
            {"permissions": {"deny": ["Read(//**/gha-creds-*.json)", "Read(./.git/**)", "Grep(./.git/**)", "Glob(./.git/**)"]}}
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL }}
            --allowedTools "Read(./**),Grep(./**),Glob(./**),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(gh pr comment ${{ steps.resolve-pr.outputs.number }}:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/issues/${{ steps.resolve-pr.outputs.number }}/comments*),Bash(gh api -X PATCH repos/${{ github.repository }}/issues/comments/*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.resolve-pr.outputs.number }}

            Review this pull request. This is an integration-test repository for
            RHEL for Edge and Fedora IoT, made up mostly of self-contained Bash
            test scripts, GitHub Actions workflows, and FMF/tmt test metadata
            (see AGENTS.md, which you should follow).

            Focus on:
            - Bash correctness: quoting, error handling, unset variables, and
              portability across the distros these scripts target.
            - GitHub Actions workflow correctness and supply-chain hygiene
              (unpinned actions, over-broad permissions, injectable inputs).
            - Real bugs, security issues, and anything secret accidentally
              committed.

            If any CI checks on this PR have failed, look at the job logs and
            explain what went wrong and why, rather than just noting the
            failure.

            Do not nitpick style already covered by the repo linters (shellcheck,
            yamllint, codespell, commitlint). Skip generic praise.

            For the top-level summary, don't rely on "edit the last comment"
            -- the pointer comment below means the bot's own last comment is
            usually that pointer, not the summary. Instead: list this PR's
            comments with
            `gh api repos/${{ github.repository }}/issues/${{ steps.resolve-pr.outputs.number }}/comments`,
            find the one whose body starts with the header below, and update
            it in place with
            `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@-`
            (pipe the new body in on stdin via a heredoc). If no such comment
            exists yet, create one with
            `gh pr comment ${{ steps.resolve-pr.outputs.number }}` instead.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific inline comments. Only post GitHub
            comments; don't submit review text as plain chat messages.

            After that, always post a second, separate, new one-line comment
            pointing back at the summary, e.g. "🔄 New changes reviewed, see
            the updated summary above." Use
            `gh pr comment ${{ steps.resolve-pr.outputs.number }}` again for
            this; it prints the URL of the comment it just posted on success,
            link to that URL. This gives a freshly-timestamped signal
            distinct from the summary's
            own edit, since GitHub's "edited" tooltip on a comment shows its
            original creation time, not the time of the latest edit.

            Start the top-level summary comment with this exact header (the
            GitHub-rendered author will say github-actions[bot] since this
            pilot doesn't use a GitHub App; the header is how to tell it
            apart from other automated comments on the PR):

            > 🤖 **Claude Review** (via [Claude Code Action](https://github.com/anthropics/claude-code-action))

            End the comment with a line reading
            `_Last reviewed: commit ${{ steps.review-date.outputs.short_sha }}
            on ${{ steps.review-date.outputs.date }}_` so readers can tell
            it's current without relying on GitHub's "edited" timestamp,
            which shows the comment's original creation time rather than its
            last edit.
